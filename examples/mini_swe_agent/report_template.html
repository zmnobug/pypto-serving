<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent / Serving 运行报告</title>
  <style>
    :root { color-scheme: light; font-family: Arial, "Noto Sans CJK SC", sans-serif; font-size: 14px;
      --ink: #20262a; --muted: #667277; --line: #dce1e2; --soft: #f3f6f5;
      --model: #087c75; --action: #326ca8; --warn: #b47116; --bad: #ba3e42; --good: #168354; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #fff; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .wrap { width: min(1480px, calc(100% - 48px)); margin: auto; }
    header { border-bottom: 1px solid var(--line); background: #f8faf9; }
    header .wrap { padding: 26px 0 22px; }
    .eyebrow { color: var(--model); font-weight: 700; font-size: 12px; text-transform: uppercase; }
    .headline { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    h1 { margin: 6px 0 8px; font-size: 27px; line-height: 1.2; overflow-wrap: anywhere; }
    .run-meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
    .status { border: 1px solid currentColor; border-radius: 4px; padding: 5px 9px; font-weight: 700; white-space: nowrap; }
    .status.good { color: var(--good); } .status.bad { color: var(--bad); }
    main { padding: 28px 0 46px; }
    h2 { margin: 0 0 16px; font-size: 17px; line-height: 1.3; }
    h3 { margin: 0 0 12px; font-size: 14px; }
    section { border-bottom: 1px solid var(--line); padding-bottom: 28px; margin-bottom: 29px; }
    .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--line); }
    .kpi { padding: 16px; min-height: 94px; border-right: 1px solid var(--line); }
    .kpi:last-child { border-right: 0; }
    .kpi-label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 10px; }
    .kpi-value { display: block; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .kpi-unit { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }
    .breakdown { height: 24px; display: flex; overflow: hidden; background: var(--soft); margin: 2px 0 13px; }
    .breakdown > span { height: 100%; min-width: 0; }
    .model-color { background: var(--model); } .action-color { background: var(--action); }
    .other-color { background: #a9b3b6; }
    .legend { display: flex; gap: 20px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
    .legend-item { display: flex; align-items: center; gap: 7px; }
    .legend-mark { width: 10px; height: 10px; flex: 0 0 10px; }
    .note { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 13px 0 0; }
    .notice { border-left: 3px solid var(--warn); padding: 10px 13px; background: #fff9ef;
      color: #684719; margin: 0 0 20px; line-height: 1.5; }
    .work-head { display: flex; justify-content: space-between; align-items: end; flex-wrap: wrap; gap: 15px; }
    .controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
    .segments { display: flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
    .segments button { border: 0; border-right: 1px solid var(--line); background: white; padding: 7px 12px; color: var(--muted); }
    .segments button:last-child { border-right: 0; }
    .segments button[aria-pressed="true"] { background: var(--ink); color: white; }
    input[type="search"] { border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; min-width: 220px;
      width: min(310px, 100%); outline-color: var(--model); }
    .work { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(330px, .85fr); gap: 22px; align-items: start; }
    .timeline, .detail { border: 1px solid var(--line); min-width: 0; }
    .timeline-head { display: grid; grid-template-columns: 70px minmax(180px, 1fr) 90px minmax(130px, .8fr);
      gap: 12px; padding: 9px 13px; color: var(--muted); background: var(--soft); font-size: 12px; }
    .event-list { max-height: 670px; overflow-y: auto; }
    .event-row { display: grid; grid-template-columns: 70px minmax(180px, 1fr) 90px minmax(130px, .8fr);
      gap: 12px; width: 100%; align-items: center; padding: 11px 13px; background: white; border: 0;
      border-top: 1px solid var(--line); text-align: left; color: var(--ink); min-height: 67px; }
    .event-row:hover { background: #f6faf9; }
    .event-row[aria-selected="true"] { background: #edf7f5; box-shadow: inset 3px 0 var(--model); }
    .event-row:focus-visible, .segments button:focus-visible, .finding:focus-visible { outline: 2px solid var(--model); outline-offset: -2px; }
    .time, .duration { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
    .event-title { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .event-title strong, .event-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .event-title strong { font-weight: 600; }
    .event-sub { display: block; color: var(--muted); font-size: 12px; margin-top: 5px; }
    .type { font-size: 10px; font-weight: 700; color: white; border-radius: 3px; padding: 2px 4px; flex: 0 0 auto; }
    .type.model { background: var(--model); } .type.action { background: var(--action); }
    .flag { font-size: 10px; color: var(--bad); font-weight: 700; flex: 0 0 auto; }
    .track { height: 13px; background: #eef2f2; position: relative; overflow: hidden; }
    .bar { position: absolute; top: 2px; bottom: 2px; min-width: 3px; }
    .bar.model { background: var(--model); } .bar.action { background: var(--action); }
    .bar.problem { background: var(--bad); }
    .detail { position: sticky; top: 16px; max-height: 670px; overflow-y: auto; }
    .detail-header { padding: 17px 18px 14px; border-bottom: 1px solid var(--line); background: #fbfcfc; }
    .detail-header h3 { font-size: 16px; overflow-wrap: anywhere; }
    .detail-body { padding: 15px 18px 22px; }
    .detail-body dl { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px 12px; margin: 0 0 22px; }
    dt { color: var(--muted); } dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .detail-body h4 { margin: 21px 0 10px; font-size: 13px; }
    pre { margin: 0; padding: 12px; border: 1px solid var(--line); background: var(--soft);
      overflow: auto; max-height: 260px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; line-height: 1.5; }
    .metric-table { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
    .metric-table th, .metric-table td { text-align: right; padding: 7px 3px; border-bottom: 1px solid var(--line); }
    .metric-table th:first-child, .metric-table td:first-child { text-align: left; }
    .metric-table th { color: var(--muted); font-weight: 500; }
    .replica-title { margin-top: 16px; font-weight: 700; font-size: 12px; }
    .findings { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
    .finding { text-align: left; background: #fff; border: 1px solid var(--line); border-left: 3px solid var(--warn);
      border-radius: 3px; padding: 10px 12px; color: var(--ink); min-width: 0; }
    button.finding:hover { background: #fff9ef; }
    .finding strong, .finding small { display: block; }
    .finding small { color: var(--muted); margin-top: 4px; overflow-wrap: anywhere; max-height: 3em; overflow: hidden; }
    .empty { padding: 24px 16px; color: var(--muted); text-align: center; }
    @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .kpi:nth-child(3) { border-right: 0; } .kpi:nth-child(n+4) { border-top: 1px solid var(--line); }
      .work { grid-template-columns: 1fr; } .detail { position: static; max-height: none; } }
    @media (max-width: 650px) { .wrap { width: min(100% - 28px, 1480px); } h1 { font-size: 22px; }
      .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi { min-height: 82px; padding: 12px; }
      .kpi:nth-child(3) { border-right: 1px solid var(--line); } .kpi:nth-child(even) { border-right: 0; }
      .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
      .timeline-head, .event-row { grid-template-columns: 52px minmax(0, 1fr) 65px; gap: 7px; padding-left: 9px; padding-right: 9px; }
      .timeline-head span:last-child, .event-row .track { display: none; }
      .segments { width: 100%; } .segments button { flex: 1; padding: 8px 5px; } input[type="search"] { width: 100%; }
    }
  </style>
</head>
<body>
<header><div class="wrap">
  <div class="eyebrow">PyPTO Serving / mini-swe-agent</div>
  <div class="headline"><h1 id="run-title">运行报告</h1><span id="run-status" class="status"></span></div>
  <div id="run-meta" class="run-meta"></div>
</div></header>
<main class="wrap">
  <section><h2>运行总览</h2><div id="kpis" class="kpis"></div></section>
  <section><h2>耗时分布</h2><div id="breakdown" class="breakdown"></div><div id="legend" class="legend"></div>
    <p id="time-note" class="note"></p></section>
  <section>
    <div class="work-head"><h2>执行时间线</h2><div id="controls" class="controls">
      <div class="segments" role="group" aria-label="事件筛选">
        <button type="button" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" data-filter="model" aria-pressed="false">模型</button>
        <button type="button" data-filter="action" aria-pressed="false">工具</button>
        <button type="button" data-filter="issues" aria-pressed="false">异常</button>
      </div><input id="search" type="search" placeholder="搜索请求 ID 或命令" aria-label="搜索事件">
    </div></div>
    <div id="data-notice"></div>
    <div class="work">
      <div class="timeline"><div class="timeline-head"><span>开始</span><span>事件</span><span>耗时</span><span>运行区间</span></div>
        <div id="event-list" class="event-list"></div></div>
      <aside id="detail" class="detail"><div class="empty">选择一个事件查看详情</div></aside>
    </div>
    <p class="note">运行区间按事件开始时间和持续时间绘制；事件之间可能重叠。Serving 快照是整个进程的采样，可能包含其他客户端。</p>
  </section>
  <section><h2>异常与诊断 <span id="finding-count"></span></h2><div id="findings" class="findings"></div></section>
</main>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
"use strict";
const report = JSON.parse(document.getElementById("report-data").textContent);
const summary = report.summary;
const analysis = report.analysis;
const $ = id => document.getElementById(id);
const nodes = [];
let selectedKey = null;
let currentFilter = "all";
const labels = {
  failed_check: "完成验证失败", explicit_failed_check: "显式验证失败",
  repeated_failed_check: "重复验证失败", stalled_action: "动作停滞",
  possible_no_op_edit: "编辑可能未生效", format_error: "模型输出格式错误",
  context_trimmed: "上下文裁剪", history_restarted: "历史重建",
  request_error: "请求错误", output_truncated: "输出截断"
};
function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}
function number(value) { return Number.isFinite(Number(value)) && value !== null ? Number(value).toLocaleString("zh-CN") : "—"; }
function seconds(value) {
  if (value === null || value === undefined || !Number.isFinite(Number(value))) return "—";
  const n = Number(value);
  return n >= 60 ? `${(n / 60).toFixed(1)} 分` : `${n.toFixed(n < 10 ? 2 : 1)} 秒`;
}
function timestamp(value) { const n = Date.parse(value || ""); return Number.isFinite(n) ? n : null; }
function addPair(dl, name, value) { dl.append(element("dt", "", name), element("dd", "", value ?? "—")); }
function findingDetail(finding) {
  const detail = finding.detail;
  if (typeof detail === "string") return detail;
  if (!detail || typeof detail !== "object") return "";
  if (detail.public_failures?.length) return detail.public_failures.join("\n");
  if (detail.fallback_output) return detail.fallback_output;
  if (detail.previous_message_index !== undefined)
    return `与消息 #${detail.previous_message_index} 的失败相同；跟踪文件${detail.tracked_files_changed ? "有" : "没有"}变化。`;
  return JSON.stringify(detail);
}
const title = [summary.variant, report.run_name].filter(Boolean).join(" / ");
$("run-title").textContent = title || "Agent 运行报告";
const status = $("run-status");
status.classList.add(summary.accepted ? "good" : "bad");
status.textContent = summary.accepted ? "任务通过" : "任务未通过";
const fixture = summary.fixture_sha256;
const fixtureLabel = typeof fixture === "string" ? `任务版本 ${fixture.slice(0, 12)}` :
  fixture && typeof fixture === "object" ? `任务文件 ${Object.keys(fixture).length}` : null;
$("run-meta").textContent = [summary.transport && `传输 ${summary.transport}`,
  summary.result?.exit_status && `结束状态 ${summary.result.exit_status}`,
  fixtureLabel].filter(Boolean).join("  ·  ");
const metrics = [
  ["任务耗时", seconds(summary.elapsed_seconds)],
  ["模型请求", number(report.requests.length || summary.responses)],
  ["工具动作", number(report.actions.length || analysis.action_count)],
  ["验证失败", number(summary.verification_rejections)],
  ["输入 token", number(summary.input_tokens)],
  ["输出 token", number(summary.output_tokens)]
];
for (const [label, value] of metrics) {
  const cell = element("div", "kpi");
  cell.append(element("span", "kpi-label", label), element("strong", "kpi-value", value));
  $("kpis").append(cell);
}
const elapsed = Math.max(0, Number(summary.elapsed_seconds) || 0);
const modelTime = Math.max(0, Number(summary.model_seconds) || 0);
const actionTime = Math.max(0, Number(summary.command_seconds_including_gate) || 0);
const restTime = Math.max(0, elapsed - modelTime - actionTime);
const plottedTotal = Math.max(elapsed, modelTime + actionTime, 1);
for (const [label, value, color] of [["模型调用", modelTime, "model-color"], ["工具与确认", actionTime, "action-color"],
  ["其他", restTime, "other-color"]]) {
  const part = element("span", color);
  part.style.width = `${value / plottedTotal * 100}%`;
  part.title = `${label}: ${seconds(value)}`;
  $("breakdown").append(part);
  const item = element("span", "legend-item");
  item.append(element("i", `legend-mark ${color}`), element("span", "", `${label} ${seconds(value)}`));
  $("legend").append(item);
}
$("time-note").textContent = modelTime + actionTime > elapsed + 0.1
  ? "各项计时可能重叠，图中按已记录耗时比例显示。模型调用耗时包含请求路径开销。"
  : "模型调用耗时包含请求路径开销；推理耗时另见请求详情。工具耗时包含人工确认等待。";

const findingsFor = (kind, index) => analysis.findings.filter(f =>
  kind === "model" ? f.request_index === index : f.action_index === index);
for (const [kind, events] of [["model", report.requests], ["action", report.actions]]) {
  events.forEach((event, ordinal) => {
    const index = Number.isInteger(event.index) ? event.index : ordinal;
    const findings = findingsFor(kind, index);
    const bad = kind === "model" ? event.status === "error" || event.finish_reason === "length"
      : event.error_type || (event.returncode !== null && event.returncode !== undefined && event.returncode !== 0)
        || event.verification_passed === false || event.stalled;
    nodes.push({kind, event, index, key: `${kind}:${index}`, start: timestamp(event.started_at),
      duration: Math.max(0, Number(event.duration_seconds) || 0), findings, bad: Boolean(bad || findings.length)});
  });
}
nodes.sort((a, b) => (a.start ?? Infinity) - (b.start ?? Infinity) ||
  (a.kind === "model" ? -1 : 1) - (b.kind === "model" ? -1 : 1) || a.index - b.index);
const dated = nodes.filter(node => node.start !== null);
const firstStart = dated.length ? Math.min(...dated.map(node => node.start)) : 0;
const finalEnd = dated.length ? Math.max(...dated.map(node => node.start + node.duration * 1000)) : 0;
const span = Math.max(elapsed * 1000, finalEnd - firstStart, 1000);
function labelFor(node) {
  if (node.kind === "model") return `请求 #${node.index + 1}`;
  return `动作 #${node.index + 1}`;
}
function subtitleFor(node) {
  const e = node.event;
  return node.kind === "model" ? [e.request_id || "无请求 ID", e.finish_reason || e.error_type || e.status].filter(Boolean).join(" · ")
    : (e.command || "无命令").replace(/\s+/g, " ");
}
function drawTimeline() {
  const list = $("event-list");
  list.replaceChildren();
  const query = $("search").value.trim().toLowerCase();
  const shown = nodes.filter(node => (currentFilter === "all" || currentFilter === node.kind ||
    (currentFilter === "issues" && node.bad)) &&
    (!query || `${labelFor(node)} ${subtitleFor(node)}`.toLowerCase().includes(query)));
  if (!shown.length) { list.append(element("div", "empty", nodes.length ? "没有匹配的事件" : "这次运行没有请求或动作事件")); return; }
  for (const node of shown) {
    const row = element("button", "event-row");
    row.type = "button";
    row.setAttribute("aria-selected", node.key === selectedKey ? "true" : "false");
    const offset = node.start === null ? null : Math.max(0, (node.start - firstStart) / 1000);
    row.append(element("span", "time", offset === null ? "—" : `+${Math.round(offset)}s`));
    const description = element("span", "");
    const line = element("span", "event-title");
    line.append(element("span", `type ${node.kind}`, node.kind === "model" ? "模型" : "工具"),
      element("strong", "", labelFor(node)));
    if (node.bad) line.append(element("span", "flag", "异常"));
    description.append(line, element("span", "event-sub", subtitleFor(node)));
    row.append(description, element("span", "duration", seconds(node.duration)));
    const track = element("span", "track");
    const bar = element("span", `bar ${node.bad ? "problem" : node.kind}`);
    bar.style.left = `${offset === null ? 0 : Math.min(99, offset * 1000 / span * 100)}%`;
    bar.style.width = `${Math.max(.3, node.duration * 1000 / span * 100)}%`;
    track.append(bar);
    row.append(track);
    row.addEventListener("click", () => selectNode(node.key));
    list.append(row);
  }
}
function selectNode(key) {
  selectedKey = key;
  const node = nodes.find(item => item.key === key);
  if (!node) return;
  drawTimeline();
  const panel = $("detail");
  panel.replaceChildren();
  const head = element("div", "detail-header");
  head.append(element("h3", "", `${labelFor(node)} · ${node.kind === "model" ? "模型请求" : "工具动作"}`),
    element("div", "run-meta", node.event.started_at || "未记录开始时间"));
  const body = element("div", "detail-body");
  const dl = element("dl", "");
  addPair(dl, "持续时间", seconds(node.duration));
  if (node.kind === "model") fillRequest(body, dl, node);
  else fillAction(body, dl, node);
  body.prepend(dl);
  if (node.findings.length) {
    body.append(element("h4", "", "诊断标记"));
    for (const finding of node.findings) {
      body.append(element("div", "notice", labels[finding.kind] || finding.kind));
      const detail = findingDetail(finding);
      if (detail) body.append(element("pre", "", detail));
    }
  }
  panel.append(head, body);
}
function fillRequest(body, dl, node) {
  const e = node.event;
  addPair(dl, "请求 ID", e.request_id);
  addPair(dl, "结果", e.status === "error" ? `失败 · ${e.error_type || "未知错误"}` : e.finish_reason || e.status);
  addPair(dl, "输入 token", number(e.prompt_tokens));
  addPair(dl, "输出 token", number(e.output_tokens));
  addPair(dl, "输出上限", number(e.output_reserve));
  addPair(dl, "Thinking", e.enable_thinking === true ? "开启" : e.enable_thinking === false ? "关闭" : "—");
  addPair(dl, "推理耗时", seconds(e.duration_seconds));
  addPair(dl, "指标采样", seconds(e.serving_sampling_seconds));
  if (e.error_message) { body.append(element("h4", "", "错误信息"), element("pre", "", e.error_message)); }
  const context = report.context_events[e.context_event_index];
  if (context) {
    const dropped = context.dropped_message_indices?.length || 0;
    const shortened = context.shortened_message_indices?.length || 0;
    if (dropped || shortened || context.history_restarted) {
      body.append(element("h4", "", "上下文处理"), element("div", "", `丢弃 ${dropped} 条消息 · 缩短 ${shortened} 条消息${context.history_restarted ? " · 历史已重建" : ""}`));
    }
  }
  body.append(element("h4", "", "Serving 快照（进程级）"));
  const before = e.serving_before, after = e.serving_after;
  if (!before || !after) { body.append(element("div", "run-meta", "未采样或当前记录没有 Serving 指标。")); return; }
  if (before.error || after.error) {
    body.append(element("div", "notice", `采样失败：${before.message || after.message || before.error || after.error}`));
    return;
  }
  const engines = new Set([...(before.replicas || []), ...(after.replicas || [])].map(r => r.engine));
  if (!engines.size) { body.append(element("div", "run-meta", "快照没有副本数据。")); return; }
  for (const engine of engines) {
    const b = (before.replicas || []).find(r => r.engine === engine) || {};
    const a = (after.replicas || []).find(r => r.engine === engine) || {};
    body.append(element("div", "replica-title", `Engine ${engine}`));
    const table = element("table", "metric-table");
    const header = element("tr", "");
    for (const name of ["指标", "请求前", "请求后"]) header.append(element("th", "", name));
    table.append(header);
    for (const [name, source, key] of [["运行中", "gauges", "running"], ["排队中", "gauges", "waiting"],
      ["KV cache 使用", "gauges", "kv_cache_usage"], ["累计抢占", "counters", "preemptions"],
      ["累计完成", "counters", "requests_finished"], ["累计错误", "counters", "requests_error"]]) {
      const row = element("tr", "");
      row.append(element("td", "", name), element("td", "", number(b[source]?.[key])),
        element("td", "", number(a[source]?.[key])));
      table.append(row);
    }
    body.append(table);
  }
}
function fillAction(body, dl, node) {
  const e = node.event;
  addPair(dl, "退出码", e.returncode);
  addPair(dl, "验证结果", e.verification_passed === null || e.verification_passed === undefined ? "未触发" :
    e.verification_passed ? "通过" : "失败");
  addPair(dl, "改动文件", e.changed_files?.length ? e.changed_files.join(", ") : "无");
  addPair(dl, "动作停滞", e.stalled ? "是" : "否");
  if (e.repeat_failure_count) addPair(dl, "连续失败", `${e.repeat_failure_count} 次`);
  if (e.error_type) addPair(dl, "错误类型", e.error_type);
  body.append(element("h4", "", "执行命令"), element("pre", "", e.command || "未记录"));
}
const noEvents = !report.requests.length || !report.actions.length;
if (noEvents) {
  $("data-notice").append(element("div", "notice",
    "该记录缺少请求或动作事件。总览仍来自 summary.json；时间线只展示已记录的事件，不能还原缺失步骤。"));
}
drawTimeline();
if (nodes.length) selectNode(nodes[0].key);
for (const button of document.querySelectorAll("[data-filter]")) {
  button.addEventListener("click", () => {
    currentFilter = button.dataset.filter;
    for (const item of document.querySelectorAll("[data-filter]")) item.setAttribute("aria-pressed", String(item === button));
    drawTimeline();
  });
}
$("search").addEventListener("input", drawTimeline);
$("finding-count").textContent = `(${analysis.findings.length})`;
if (!analysis.findings.length) $("findings").append(element("div", "run-meta", "未识别到异常标记。"));
for (const finding of analysis.findings) {
  const key = finding.request_index !== undefined ? `model:${finding.request_index}` :
    finding.action_index !== undefined ? `action:${finding.action_index}` : null;
  const target = key && nodes.some(node => node.key === key);
  const item = element("button", "finding");
  item.type = "button";
  if (target) {
    item.addEventListener("click", () => {
      currentFilter = "all";
      $("search").value = "";
      for (const button of document.querySelectorAll("[data-filter]"))
        button.setAttribute("aria-pressed", String(button.dataset.filter === "all"));
      selectNode(key);
      document.querySelector('.event-row[aria-selected="true"]')?.scrollIntoView({block: "nearest"});
    });
  } else {
    item.addEventListener("click", () => {
      selectedKey = null;
      drawTimeline();
      const panel = $("detail");
      panel.replaceChildren();
      const head = element("div", "detail-header");
      head.append(element("h3", "", labels[finding.kind] || finding.kind));
      const body = element("div", "detail-body");
      body.append(element("div", "run-meta", location));
      const detail = findingDetail(finding);
      if (detail) body.append(element("h4", "", "诊断内容"), element("pre", "", detail));
      panel.append(head, body);
    });
  }
  const location = finding.request_index !== undefined ? `请求 #${finding.request_index + 1}` :
    finding.action_index !== undefined ? `动作 #${finding.action_index + 1}` :
      finding.message_index !== undefined ? `消息 #${finding.message_index}` : "运行级";
  const detail = findingDetail(finding).split("\n")[0];
  item.append(element("strong", "", labels[finding.kind] || finding.kind),
    element("small", "", [location, detail].filter(Boolean).join(" · ")));
  $("findings").append(item);
}
</script>
</body>
</html>
